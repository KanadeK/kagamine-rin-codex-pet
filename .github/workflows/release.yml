name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run release gate
        run: python scripts/release_check.py --json
      - name: Build deterministic assets
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --version "${TAG#v}" --output dist --json
      - name: Verify archives, manifests, and checksums
        run: python scripts/verify_release.py --artifacts dist --manifest dist/release-manifest.json --checksums dist/SHA256SUMS --json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/*.zip dist/*.codex-pet dist/SHA256SUMS dist/release-manifest.json \
              --clobber
          else
            gh release create "$TAG" \
              dist/*.zip dist/*.codex-pet dist/SHA256SUMS dist/release-manifest.json \
              --title "Kagamine Rin Codex Pet $TAG" \
              --notes-file docs/RELEASE_NOTES_0.1.0.md \
              --verify-tag
          fi
